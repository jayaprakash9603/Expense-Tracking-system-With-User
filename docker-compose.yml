# Monolithic full-stack deployment: MySQL + backend + frontend
# No Kafka, Zookeeper, or Redis required.
#
# Quick start:
#   copy .env.example .env
#   .\scripts\docker-build.ps1          # Maven-builds JAR if missing, then images
#   docker compose up -d
#
# Manual JAR + image build:
#   cd expense-tracking-backend && mvn clean install -P monolithic -DskipTests
#   docker compose build monolith frontend
#
# Access:
#   Frontend  → http://localhost:9999
#   Backend   → http://localhost:8080
#   Swagger   → http://localhost:8080/swagger-ui.html
#   MySQL     → localhost:4000 (root / see .env)

name: expense-tracker

services:
  mysql:
    image: mysql:8.0
    container_name: expense-tracker-mysql
    ports:
      - "${MYSQL_PORT:-4000}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-expense_tracker_monolith}
    networks:
      - expense-net
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  monolith:
    build:
      context: ./expense-tracking-backend/monolithic-service
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${MONOLITH_VERSION:-1.1.0}
    image: ${DOCKER_REGISTRY:-jayaprakash9603}/expense-tracker-monolith:${MONOLITH_VERSION:-1.1.0}
    container_name: expense-tracker-monolith
    ports:
      - "${MONOLITH_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: monolithic
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-expense_tracker_monolith}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-change-in-production-min-32-chars}
      SERVICE_INTERNAL_TOKEN: ${SERVICE_INTERNAL_TOKEN:-dev-internal-service-token-change-in-production}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      APP_VERSION: ${MONOLITH_VERSION:-1.1.0}
    networks:
      - expense-net
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: ./expense-tracking-frontend
      dockerfile: Dockerfile
      args:
        APP_VERSION: latest
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-http://localhost:8080}
    image: ${DOCKER_REGISTRY:-jayaprakash9603}/expense-tracker-frontend:latest
    container_name: expense-tracker-frontend
    ports:
      - "${FRONTEND_PORT:-9999}:80"
    networks:
      - expense-net
    depends_on:
      monolith:
        condition: service_healthy
    restart: unless-stopped

networks:
  expense-net:
    driver: bridge

volumes:
  mysql_data:

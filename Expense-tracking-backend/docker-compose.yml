      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/analytics_service?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      USER_SERVICE_URL: http://user-service:6001
      EXPENSE_SERVICE_URL: http://expense-service:6000
      BUDGET_SERVICE_URL: http://budget-service:6005
      CATEGORY_SERVICE_URL: http://category-service:6008
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_started
      expense-service:
        condition: service_started
    restart: unless-stopped

  frontend-micro:
    profiles: [microservices]
    image: ${DOCKER_REGISTRY:-jayaprakash9603}/expense-tracker-frontend:${APP_VERSION:-1.1.0}
    container_name: expense-tracker-frontend-micro
    ports:
      - "3000:80"
    networks:
      - expense-net
    environment:
      REACT_APP_API_URL: http://gateway:8080
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped

networks:
  expense-net:
    driver: bridge

volumes:
  mysql_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:

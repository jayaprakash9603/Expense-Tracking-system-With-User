# Expense Tracker — single Docker Compose file (monolith default).
#
# Quick start (recommended — monolith + MySQL + frontend):
#   cd expense-tracking-backend
#   copy .env.example .env
#   docker compose --profile monolith up -d
#
# Optional profiles:
#   docker compose --profile infra up -d          # Kafka + Redis + Zookeeper (local dev)
#   docker compose --profile sonar up -d          # SonarQube code quality server
#   docker compose --profile microservices up -d  # Full 14-service microservices stack
#
# From repo root (build script):
#   .\scripts\docker-build.ps1
#   docker compose -f expense-tracking-backend/docker-compose.yml up -d
#
# Access (monolith default):
#   Frontend  → http://localhost:9999
#   Backend   → http://localhost:8080
#   Swagger   → http://localhost:8080/swagger-ui.html
#   MySQL     → localhost:4000

name: expense-tracker

services:
  mysql:
    profiles: [monolith, microservices]
    image: mysql:8.0
    container_name: expense-tracker-mysql
    ports:
      - "${MYSQL_PORT:-4000}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-expense_tracker_monolith}
    networks:
      - expense-net
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  monolith:
    profiles: [monolith]
    build:
      context: ./monolithic-service
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.1.0}
    image: ${DOCKER_REGISTRY:-jayaprakash9603}/expense-tracker-monolith:${APP_VERSION:-1.1.0}
    container_name: expense-tracker-monolith
    ports:
      - "${MONOLITH_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: monolithic
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-expense_tracker_monolith}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-change-in-production-min-32-chars}
      SERVICE_INTERNAL_TOKEN: ${SERVICE_INTERNAL_TOKEN:-dev-internal-service-token-change-in-production}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      APP_VERSION: ${APP_VERSION:-1.1.0}
    networks:
      - expense-net
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/config/features > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    profiles: [monolith]
    build:
      context: ../expense-tracking-frontend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.1.0}
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-http://localhost:8080}
    image: ${DOCKER_REGISTRY:-jayaprakash9603}/expense-tracker-frontend:${APP_VERSION:-1.1.0}
    container_name: expense-tracker-frontend
    ports:
      - "${FRONTEND_PORT:-9999}:80"
    networks:
      - expense-net
    depends_on:
      monolith:
        condition: service_healthy
    restart: unless-stopped

  zookeeper:
    profiles: [infra, microservices]
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: expense-tracker-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - expense-net
    restart: unless-stopped

  kafka:
    profiles: [infra, microservices]
    image: confluentinc/cp-kafka:7.6.1
    container_name: expense-tracker-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - expense-net
    restart: unless-stopped

  kafka-ui:
    profiles: [infra, microservices]
    image: provectuslabs/kafka-ui:latest
    container_name: expense-tracker-kafka-ui
    depends_on:
      - kafka
    ports:
      - "9080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - expense-net
    restart: unless-stopped

  redis:
    profiles: [infra, microservices]
    image: redis:7-alpine
    container_name: expense-tracker-redis
    ports:
      - "6379:6379"
    networks:
      - expense-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    profiles: [sonar]
    image: sonarqube:community
    container_name: expense-tracker-sonarqube
    ports:
      - "9001:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    restart: unless-stopped

  eureka-server:
    profiles: [microservices]
    build: ./eureka-server
    image: jayaprakash9603/eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - expense-net
    environment:
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8761 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  gateway:
    profiles: [microservices]
    build: ./Gateway
    image: jayaprakash9603/gateway:latest
    container_name: gateway
    ports:
      - "8080:8080"
    networks:
      - expense-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      USER_SERVICE_URL: lb://USER-SERVICE
      BUDGET_SERVICE_URL: lb://BUDGET-SERVICE
      CHAT_SERVICE_URL: lb://CHAT-SERVICE
      FRIENDSHIP_SERVICE_URL: lb://FRIENDSHIP-SERVICE
      PAYMENT_SERVICE_URL: lb://PAYMENT-SERVICE
      CATEGORY_SERVICE_URL: lb://CATEGORY-SERVICE
      BILL_SERVICE_URL: lb://BILL-SERVICE
      AUDIT_SERVICE_URL: lb://AUDIT-SERVICE
      EXPENSE_TRACKING_SERVICE_URL: lb://EXPENSE-TRACKING-SYSTEM
      NOTIFICATION_SERVICE_URL: lb://NOTIFICATION-SERVICE
      SEARCH_SERVICE_URL: lb://SEARCH-SERVICE
      ANALYTICS_SERVICE_URL: lb://ANALYTICS-SERVICE
      EVENT_SERVICE_URL: lb://EVENT-SERVICE
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gateway_service?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    depends_on:
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_started
    restart: unless-stopped

  user-service:

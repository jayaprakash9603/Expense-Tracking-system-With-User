# Monolithic Mode Configuration
# Run with: mvn spring-boot:run -Dspring.profiles.active=monolithic

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: expense-tracking-monolith

  profiles:
    active: monolithic

  main:
    allow-bean-definition-overriding: true

  # Use in-memory cache so @Cacheable("userSettings") etc. work (no Redis cache required)
  cache:
    type: simple

  # Single consolidated database (port 5000 matches docker-compose)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:5000/expense_tracker_monolith?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # Kafka configuration (optional in monolithic mode)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: monolith-consumer-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Restrict to application packages (security)
        spring.json.trusted.packages: "com.jaya.*"

  # Redis for caching (optional)
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Mail configuration
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Redis toggle (set REDIS_ENABLED=true to use Redis, false for in-memory)
redis:
  enabled: ${REDIS_ENABLED:false}

# Google OAuth2 Configuration
google:
  oauth2:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:214438901958-uigakv87vusc9veirq3l5ocfpfr1do3a.apps.googleusercontent.com}

# Kafka Topics (aligned with microservices; same names for producers/consumers)
kafka:

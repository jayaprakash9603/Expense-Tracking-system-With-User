    url: http://localhost:${server.port}
  budget:
    url: http://localhost:${server.port}
  category:
    url: http://localhost:${server.port}
  bill:
    url: http://localhost:${server.port}
  payment-method:
    url: http://localhost:${server.port}
  friendship:
    url: http://localhost:${server.port}
  user:
    url: http://localhost:${server.port}

# Support for Legacy/UPPERCASE URL keys used in some Feign clients
USER_SERVICE_URL: http://localhost:${server.port}
EXPENSE_SERVICE_URL: http://localhost:${server.port}
BUDGET_SERVICE_URL: http://localhost:${server.port}
CATEGORY_SERVICE_URL: http://localhost:${server.port}
BILL_SERVICE_URL: http://localhost:${server.port}
PAYMENT_SERVICE_URL: http://localhost:${server.port}
FRIENDSHIP_SERVICE_URL: http://localhost:${server.port}
NOTIFICATION_SERVICE_URL: http://localhost:${server.port}
GROUP_SERVICE_URL: http://localhost:${server.port}
ANALYTICS_USER_SERVICE_URL: http://localhost:${server.port}
# Notification-Service TaskService Feign client; point to self if task endpoints exist in monolith
TASK_SERVICE_URL: http://localhost:${server.port}

# Internal service-to-service auth (Feign /api/**/internal/**). Static for local monolith.
common-library:
  internal-service-auth:
    enabled: true
    token: expensio-static-internal-service-token-v1

SERVICE_INTERNAL_TOKEN: expensio-static-internal-service-token-v1
USER_SERVICE_INTERNAL_TOKEN: expensio-static-internal-service-token-v1

# JWT Configuration — secret is defined once in JwtSecretConstants (common-library)
jwt:
  secret: expensio-static-jwt-hmac-secret-key-min-32-chars-v1
  expiration: 86400000

# Logging
logging:
  level:
    root: INFO
    com.jaya: INFO
    # Feign client HTTP request/response dumps are DEBUG-only; keep them off to avoid
    # leaking Authorization/X-Service-Token headers and flooding the console.
    com.jaya.common.service.client.feign: WARN
    org.springframework.web: INFO
    org.springframework.web.socket.config.WebSocketMessageBrokerStats: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

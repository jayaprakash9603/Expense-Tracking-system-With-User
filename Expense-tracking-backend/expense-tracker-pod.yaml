# Single-pod full stack: frontend (nginx) + monolith backend + MySQL.
# All containers share one network namespace, so they reach each other on 127.0.0.1.
#
# Run (from expense-tracking-backend):
#   kubectl apply -f expense-tracker-pod.yaml     # Docker Desktop / minikube
#   podman play kube expense-tracker-pod.yaml     # Podman
#
# Access (exposed to the host via hostPort):
#   Frontend → http://localhost:9999
#   Backend  → http://localhost:8080
#
# Image tags must match APP_VERSION in repo VERSION file (currently 1.1.0).
apiVersion: v1
kind: Pod
metadata:
  name: expense-tracker-pod
  labels:
    app: expense-tracker
spec:
  containers:
  - name: frontend
    image: jayaprakash9603/expense-tracker-frontend:1.1.0
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 80
      hostPort: 9999

  - name: monolith
    image: jayaprakash9603/expense-tracker-monolith:1.1.0
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 8080
      hostPort: 8080
    env:
    - name: SPRING_PROFILES_ACTIVE
      value: "monolithic"
    - name: SPRING_DATASOURCE_URL
      value: "jdbc:mysql://127.0.0.1:3306/expense_tracker_monolith?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
    - name: SPRING_DATASOURCE_USERNAME
      value: "root"
    - name: SPRING_DATASOURCE_PASSWORD
      value: "123456"
    - name: DB_USERNAME
      value: "root"
    - name: DB_PASSWORD
      value: "123456"
    - name: JWT_SECRET
      value: "dev-only-secret-key-change-in-production-min-32-chars"
    - name: KAFKA_ENABLED
      value: "false"
    - name: REDIS_ENABLED
      value: "false"
    - name: APP_VERSION
      value: "1.1.0"

  - name: mysql
    image: mysql:8.0
    ports:
    - containerPort: 3306
    env:
    - name: MYSQL_ROOT_PASSWORD
      value: "123456"
    - name: MYSQL_DATABASE
      value: "expense_tracker_monolith"

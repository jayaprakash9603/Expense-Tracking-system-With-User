server:
  port: 6001

spring:
  application:
    name: USER-SERVICE
  cloud:
    compatibility-verifier:
      enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:5000/expense_user_service?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# User-profile cache (Caffeine, in-process). Entries auto-evict on any user write.
app:
  cache:
    user-profile:
      ttl-minutes: ${USER_PROFILE_CACHE_TTL_MINUTES:10}
      max-size: ${USER_PROFILE_CACHE_MAX_SIZE:10000}
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Google OAuth2 Configuration
google:
  oauth2:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:214438901958-uigakv87vusc9veirq3l5ocfpfr1do3a.apps.googleusercontent.com}

# USER_SERVICE_INTERNAL_TOKEN: shared secret for service Feign calls to GET /api/user/all|email|by-email (header X-Service-Token).
# ALLOWED_ORIGIN_PATTERNS: comma-separated CORS patterns (defaults include localhost and Netlify deploy hosts).
# AUTH_RATE_LIMIT_PER_MINUTE: POST /auth/signin|signup|check-email per client IP per rolling minute (default 40).
# JWT_SECRET: required for production when spring.profiles.active includes prod or production (see ProductionJwtSecretValidator).

# Netlify config for Expense Tracking frontend (SPA)
# Ensure build output and SPA redirects are correct so /dashboard, etc. work after login.

[build]
  command   = "npm run build"
  publish   = "build"
  base      = "."

# SPA fallback: serve index.html for all routes so client-side routing works.
# Without this, visiting /dashboard (e.g. after login) returns 404 and a blank page.
[[redirects]]
  from    = "/*"
  to      = "/index.html"
  status  = 200

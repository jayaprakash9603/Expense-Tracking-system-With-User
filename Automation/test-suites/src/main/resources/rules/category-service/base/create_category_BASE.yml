rules:
  - name: response_has_id
    description: "Created category should have an id"
    condition:
      source: "#jsonPath([response],'$.id')"
      operator: "notNull"

  - name: category_name_present
    description: "Response should contain category name"
    condition:
      source: "#jsonPath([response],'$.categoryName')"
      operator: "notNull"
